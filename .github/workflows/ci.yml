#
# Tiers T0 and T1 from docs/VERIFY.md. T2 (Isaac Sim) and T3 (Newton/MuJoCo)
# need an NVIDIA GPU and are not run here.
#
# `references/` is not tracked by git, so the reference-source tests in
# tests/unit/test_reference_sources.py skip on this runner. That is expected:
# tests/conftest.py::have_git_references gates them, and the CI summary below
# reports how many skipped so a silent disappearance is visible.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff + black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.10 .venv
      - run: uv pip install --python .venv/bin/python -e '.[core,schemas]' --group dev
      - name: ruff
        run: .venv/bin/ruff check .
      - name: black
        run: .venv/bin/black --check .

  t0:
    name: T0 unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python ${{ matrix.python-version }} .venv
      - run: uv pip install --python .venv/bin/python -e '.[core,schemas]' --group dev
      - name: pytest tests/unit
        run: .venv/bin/python -m pytest tests/unit -q -rs

  t1:
    name: T1 converter matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.10 .venv
      - run: uv pip install --python .venv/bin/python -e '.[core,schemas]' --group dev
      # Builds one isolated venv per converter version and converts every
      # fixture with each. Failures are recorded in matrix.json, and
      # tests/converter fails (not skips) on a recorded failure.
      - name: run the converter matrix
        run: .venv/bin/python scripts/run_converter_matrix.py
      - name: pytest tests/converter
        run: .venv/bin/python -m pytest tests/converter -q -rs
      - name: upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: converter-matrix
          path: |
            tests/_artifacts/matrix.json
            tests/_artifacts/**/*.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: packaging (build + clean install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - name: twine check
        run: uvx twine check dist/*
      # docs/VERIFY.md T4. The install happens in /tmp so an import can never
      # fall through to the source tree and report a success that isn't one.
      - name: install the wheel into a clean venv and run the CLI
        run: |
          uv venv --python 3.12 /tmp/fresh
          uv pip install --python /tmp/fresh/bin/python "$(echo dist/*.whl)[core]"
          cd /tmp
          /tmp/fresh/bin/urdf-usd-bridge --version
          /tmp/fresh/bin/python -c "import urdf_usd_bridge, pathlib; p = pathlib.Path(urdf_usd_bridge.__file__); assert 'site-packages' in p.parts, p"
      - name: the sdist must carry a runnable test suite
        run: |
          mkdir -p /tmp/sd && tar xzf dist/*.tar.gz -C /tmp/sd --strip-components=1
          uv pip install --python /tmp/fresh/bin/python pytest
          cd /tmp/sd && /tmp/fresh/bin/python -m pytest tests/unit -q -rs
      - name: no third-party or scratch file may be in the artifacts
        run: |
          if python -m zipfile -l dist/*.whl | grep -Ei "references/|_artifacts|sim_artifacts|__pycache__"; then
            echo "::error::unexpected content in the wheel" && exit 1
          fi
          if tar tzf dist/*.tar.gz | grep -Ei "references/|_artifacts|sim_artifacts|__pycache__"; then
            echo "::error::unexpected content in the sdist" && exit 1
          fi
