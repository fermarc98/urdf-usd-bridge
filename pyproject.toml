[project]
name = "urdf-usd-bridge"
dynamic = ["version"]
description = "Stability layer and cross-backend validator for URDF-derived OpenUSD robot assets"
authors = [{ name = "urdf-usd-bridge contributors" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = [
    "urdf",
    "usd",
    "openusd",
    "isaac-sim",
    "physx",
    "mujoco",
    "newton",
    "robotics",
    "simulation",
    "physics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Typing :: Typed",
]

# Core has NO hard USD dependency: we code against the `pxr` API, but let the
# consumer choose which distribution provides it. Pick exactly one extra:
#   [core]      -> usd-core from PyPI (works on Linux, Windows, macOS)
#   [exchange]  -> usd-exchange, which vendors pxr AND usdex.core
#                  (NOTE: no macOS wheels are published for usd-exchange)
dependencies = [
    "numpy>=1.24",
]

# Every bound below names a version this release was actually run against;
# docs/VERIFY.md and README.md carry the same matrix. Upper bounds are set
# where a major bump is known to move an interface we read, not defensively.
[project.optional-dependencies]
# Tested: usd-core 26.8.
core = ["usd-core>=25.5"]
# usd-exchange publishes manylinux and win_amd64 wheels only -- there is no
# macOS wheel for any version, which is why this is not the default.
# Tested: 2.3.0 (the version Isaac Sim 6.1.0 ships) and 3.0.0.
exchange = ["usd-exchange>=2.2.2"]
# The thin `convert` front-end. Pinned to the exact converter Isaac Sim 6.1.0
# ships, because our repairs are calibrated against what it authors; 0.3.3 is
# also tested and differs in the two inertia fixes noted in docs/history/ANALYSIS.md.
# Transitively requires usd-exchange, so Linux/Windows only.
convert = ["urdf-usd-converter==0.3.2", "usd-exchange>=2.2.2"]
# Tested: 0.4.1 (Isaac Sim 6.1.0 parity) and 0.5.0.
schemas = ["newton-usd-schemas>=0.4.0,<0.6"]
# Tested: 3.11.0 (Isaac parity) and 3.12.0.
mujoco = ["mujoco>=3.11.0,<3.13"]
# Tested: newton 1.5.0 (bundled in Isaac Sim 6.1.0) and 1.6.0 from PyPI.
# Both reproduce the SolverFeatherstone divergence in docs/UPSTREAM_ISSUES.md
# issue 3 identically, so neither is preferred here.
newton = ["newton[sim]>=1.5.0,<1.7", "newton-usd-schemas>=0.4.1,<0.6"]
# Everything that runs on a workstation without a GPU.
all = [
    "urdf-usd-bridge[core,schemas]",
]

[project.urls]
Homepage = "https://github.com/fermarc98/urdf-usd-bridge"
Repository = "https://github.com/fermarc98/urdf-usd-bridge"
Issues = "https://github.com/fermarc98/urdf-usd-bridge/issues"
Changelog = "https://github.com/fermarc98/urdf-usd-bridge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/fermarc98/urdf-usd-bridge/blob/main/docs/API.md"

[project.scripts]
urdf-usd-bridge = "urdf_usd_bridge.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "coverage>=7.4",
    "ruff>=0.11",
    "black>=25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/urdf_usd_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/urdf_usd_bridge"]

[tool.hatch.build.targets.sdist]
# The sdist carries what a reader needs to check the claims: the tests, the
# fixtures they run on, and the docs the README cites. It does not carry
# references/ (read-only upstream checkouts) or any simulation artifact.
include = [
    "src/urdf_usd_bridge",
    "tests",
    "docs",
    "examples",
    "scripts",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY.md",
    "CITATION.cff",
    "pyproject.toml",
]
exclude = [
    "tests/_artifacts",
    "**/__pycache__",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "converter: needs urdf-usd-converter (requires usd-exchange; no macOS wheels)",
    "isaacsim: needs an Isaac Sim / Kit runtime (Linux + NVIDIA GPU only)",
    "gpu: needs an NVIDIA GPU (Linux only)",
]
filterwarnings = ["error::DeprecationWarning:urdf_usd_bridge.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# scripts/run_converter_matrix.py builds real virtualenvs in here. Ruff skips
# them via .gitignore inside a git checkout, but not in an exported tree, so
# the exclusion is explicit rather than incidental.
extend-exclude = ["tests/_artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "C4", "SIM", "PTH", "RUF"]

[tool.black]
line-length = 110
target-version = ["py310"]
extend-exclude = "tests/_artifacts"
